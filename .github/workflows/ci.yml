name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify module downloads
        run: go mod verify

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          test -z "$files"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test for races
        run: go test -race ./...

      - name: Build
        run: go build -trimpath ./cmd/gobiesvm

      - name: Check vulnerabilities
        run: go tool govulncheck ./...
